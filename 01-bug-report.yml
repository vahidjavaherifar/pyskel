name: "Bug Report"
description: "Report a reproducible problem to help us investigate and fix it."
title: "[BUG]: "
labels:
  - "type:bug"
  - "status:triage"

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        Please provide enough context to help us reproduce and resolve the issue.
        Ensure all sensitive credentials, tokens, or private details are redacted before submitting.

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "Describe the problem clearly and concisely, including what happened and any relevant conditions."
      placeholder: "Describe what went wrong and under what circumstances..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "Provide step-by-step instructions or a minimal example to reproduce the issue."
      placeholder: |
        1. ...
        2. ...
        3. ...
        X. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "A clear description of what you expected to happen."
      placeholder: "Describe the expected behavior..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "Describe what actually happened instead of the expected behavior."
      placeholder: "Describe what happened instead..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal Reproduction"
      description: "Provide the smallest code sample, command, configuration, or repository that reliably reproduces the problem, if applicable."
      placeholder: "Provide a minimal reproduction, if applicable..."

  - type: input
    id: version
    attributes:
      label: "Version"
      description: "Specify the version, tag, release, branch, or commit hash where the bug occurs."
      placeholder: "Enter the affected version, tag, release, branch, or commit hash..."
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      options:
        - "Linux"
        - "macOS"
        - "Windows"
        - "Android"
        - "iOS"
        - "Other"
        - "Not applicable"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Provide environment details that may be relevant to reproducing or investigating the problem."
      placeholder: "Provide the relevant environment details..."

  - type: textarea
    id: logs
    attributes:
      label: "Logs / Stack Traces"
      description: "Provide relevant logs, error messages, stack traces, or command output."
      placeholder: "Paste the relevant logs, errors, stack traces, or output..."
      render: text

  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: "Add any other context, screenshots, or references about the problem."
      placeholder: "Any additional details, links, or screenshots..."

  - type: checkboxes
    id: confirmation
    attributes:
      label: "Confirmation"
      options:
        - label: "I have searched existing issues and confirmed that this is not a duplicate."
          required: true
        - label: "I have confirmed that this issue is reproducible with the latest version."
          required: true
